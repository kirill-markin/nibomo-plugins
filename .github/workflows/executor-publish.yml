name: Executor Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing stable GitHub release tag (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: executor-publish-nibomo
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'kirill-markin/nibomo-plugins' && (github.event_name == 'release' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Publish reviewed release to the existing Executor app
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXECUTOR_API_TOKEN: ${{ secrets.EXECUTOR_API_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python scripts/publish_executor.py
