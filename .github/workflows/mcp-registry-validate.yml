name: MCP Registry Validate

on:
  pull_request:
    paths:
      - 'server.json'
      - 'scripts/validate_mcp_registry.py'
      - 'requirements-ci.txt'
      - '.github/workflows/mcp-registry-publish.yml'
      - '.github/workflows/mcp-registry-validate.yml'
  push:
    branches: [main]
    paths:
      - 'server.json'
      - 'scripts/validate_mcp_registry.py'
      - 'requirements-ci.txt'
      - '.github/workflows/mcp-registry-publish.yml'
      - '.github/workflows/mcp-registry-validate.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Validate server.json
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install schema validation dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Validate MCP Registry manifest
        run: python scripts/validate_mcp_registry.py
