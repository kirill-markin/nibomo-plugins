name: MCP Registry Validate

on:
  pull_request:
    paths:
      - 'server.json'
      - 'core-source.json'
      - '.github/workflows/mcp-registry-validate.yml'
  push:
    branches: [main]
    paths:
      - 'server.json'
      - 'core-source.json'
      - '.github/workflows/mcp-registry-validate.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Validate server.json
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    defaults:
      run:
        working-directory: companion

    steps:
      - uses: actions/checkout@v7
        with:
          path: companion
          persist-credentials: false
      - uses: kirill-markin/flashcards-open-source-app/.github/actions/checkout-core-source@408ff05aeba23e299d05a0acd307e6c77b6693b6

      - name: Install schema validation dependencies
        run: python -m pip install -r ../core/scripts/plugins/requirements-ci.txt

      - name: Validate MCP Registry manifest
        run: python ../core/scripts/plugins/validate_mcp_registry.py .
