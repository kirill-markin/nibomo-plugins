name: MCP Registry Validate

on:
  pull_request:
    paths:
      - 'server.json'
      - 'core-source.json'
      - '.github/workflows/mcp-registry-validate.yml'
  push:
    branches: [main]
    paths:
      - 'server.json'
      - 'core-source.json'
      - '.github/workflows/mcp-registry-validate.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Validate server.json
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    defaults:
      run:
        working-directory: companion

    steps:
      - uses: actions/checkout@v7
        with:
          path: companion
          persist-credentials: false
      - name: Read and validate core source pin
        id: core-source
        run: |
          jq -ers '
            if length == 1 and (.[0] | type == "object" and keys == ["commit"])
              and (.[0].commit | type == "string" and length == 40 and test("^[0-9a-f]+$"))
            then "commit=" + .[0].commit
            else error("core-source.json must contain exactly one full lowercase Git SHA in commit")
            end
          ' core-source.json >> "$GITHUB_OUTPUT"
      - name: Check out pinned core source
        uses: actions/checkout@v7
        with:
          repository: kirill-markin/flashcards-open-source-app
          ref: ${{ steps.core-source.outputs.commit }}
          path: core
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install schema validation dependencies
        run: python -m pip install -r ../core/scripts/plugins/requirements-ci.txt

      - name: Validate MCP Registry manifest
        run: python ../core/scripts/plugins/validate_mcp_registry.py .
